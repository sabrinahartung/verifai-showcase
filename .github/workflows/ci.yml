name: tests & docs

on:
  push:
    branches: [master]        # this repo's default branch is master, not main
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                  # a rapid second push cancels the first deploy
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels on purpose: the default torch wheel pulls ~2.5 GB of CUDA for
      # a runner with no GPU. Installed before requirements-engine.txt so its
      # plain `torch` line is already satisfied.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-engine.txt -r requirements-dev.txt

      - name: Run the contract tests
        run: pytest tests/ -q

  docs:
    needs: test               # never publish docs describing code that fails
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      # --strict fails on a broken internal link, so a bad cross-reference
      # breaks the build instead of shipping a dead link.
      - run: mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
